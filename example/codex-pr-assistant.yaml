name: Codex PR Assistant

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

jobs:
  codex:
    if: |
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request != null &&
       contains(github.event.comment.body, '@codex')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@codex')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@codex'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    outputs:
      final_message: ${{ steps.run_codex.outputs.final-message }}
      pr_number: ${{ steps.pr_context.outputs.number }}
    steps:
      - name: Gather PR context
        id: pr_context
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const payload = context.payload;
            if (context.eventName === 'issue_comment') {
              const { data: pr } = await github.rest.pulls.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: payload.issue.number,
              });
              core.setOutput('number', String(pr.number));
              core.setOutput('head_ref', pr.head.ref);
              core.setOutput('head_sha', pr.head.sha);
              core.setOutput('base_sha', pr.base.sha);
              core.setOutput('title', pr.title ?? '');
              core.setOutput('body', pr.body ?? '');
            } else {
              const pr = payload.pull_request;
              core.setOutput('number', String(pr.number));
              core.setOutput('head_ref', pr.head.ref);
              core.setOutput('head_sha', pr.head.sha);
              core.setOutput('base_sha', pr.base.sha);
              core.setOutput('title', pr.title ?? '');
              core.setOutput('body', pr.body ?? '');
            }

      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
          ref: ${{ steps.pr_context.outputs.head_ref }}

      # this step assumes a Node.js project; modify as needed for other environments
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      # this step assumes a Node.js project; modify as needed for other environments
      # dependencies must installed before running Codex Action because Codex do not have internet access
      - name: run npm install
        run: npm install

      - name: Set up Git
        run: |
          git config --global user.name "codex[bot]"
          git config --global user.email "codex[bot]@users.noreply.github.com"

      - name: Run Codex PR Action
        id: run_codex
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          prompt: |
            This is PR #${{ steps.pr_context.outputs.number }} in the repository ${{ github.repository }}.
            Base SHA: ${{ steps.pr_context.outputs.base_sha }}
            Head SHA: ${{ steps.pr_context.outputs.head_sha }}

            Title: ${{ steps.pr_context.outputs.title }}
            Body: 
            ----
            ${{ steps.pr_context.outputs.body }}
            ----

            Here are some guidelines to follow:
            - If the comment or review contains specific questions or requests for changes, address them directly.
            - If the comment or review is vague or lacks context, ask for clarification.
            - Make commits atomic and descriptive.
            - Make sure to run formatter and pass the tests before push your commits.
            - Make sure push your commits in the end of your work.
            - Avoid making assumptions about the author's intent or knowledge level.

            Read the following comment or review and respond based on the guidelines above:
            ----
            ${{github.event.comment.body || github.event.review.body}}
      
      - name: Push the branch
        run: git push origin ${{ steps.pr_context.outputs.head_ref }}
        continue-on-error: true

  post_feedback:
    runs-on: ubuntu-latest
    needs: codex
    if: needs.codex.outputs.final_message != ''
    permissions:
      issues: write
      pull-requests: write
    steps:
        - name: Post feedback
          uses: actions/github-script@v7
          env:
            CODEX_FINAL_MESSAGE: ${{ needs.codex.outputs.final_message }}
            PR_NUMBER: ${{ needs.codex.outputs.pr_number }}
          with:
            github-token: ${{ secrets.GITHUB_TOKEN }}
            script: |
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: Number(process.env.PR_NUMBER),
                body: process.env.CODEX_FINAL_MESSAGE,
              });
              
